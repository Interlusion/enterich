name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Lock matches pyproject.toml
        run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mdformat --check .
      - name: Markdown links
        run: scripts/check-links.sh
      - run: uv run basedpyright
      - name: Tests with branch coverage
        run: |
          uv run coverage run -m pytest -q
          uv run coverage report --skip-covered
          {
            echo "### Test coverage: $(uv run coverage report --format=total)%"
            echo
            uv run coverage report --format=markdown --skip-covered
          } > "$RUNNER_TEMP/coverage.md"
          cat "$RUNNER_TEMP/coverage.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage artefact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage.md
          if-no-files-found: error
          retention-days: 7
      - name: Vulnerability audit of the lock
        run: uv audit --locked
      - name: Workflows
        run: scripts/check-workflows.sh

  # The coverage table as one comment on the pull request, updated on every push. A job of
  # its own, so the write right stays away from the job that runs the pull request's code.
  # Pull requests from forks get a read-only token; theirs stays in the run's summary.
  coverage-comment:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --edit-last --create-if-none --body-file "$RUNNER_TEMP/coverage/coverage.md"

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks over the pushed commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="HEAD"
          else
            range="$BASE..HEAD"
          fi
          docker build -q -t gitleaks .github/gitleaks
          docker run --rm -v "$PWD:/repo" -w /repo gitleaks \
            git --redact --no-banner --log-opts="$range" .

  # Each platform on a runner of its own architecture, no emulation. The name stays
  # "image (<platform>)": the ruleset for main requires the checks by that name.
  image:
    name: image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    env:
      # The build records stay out of the run's artefacts; the job summary remains.
      DOCKER_BUILD_RECORD_UPLOAD: false
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
      - name: Test stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: test
          platforms: ${{ matrix.platform }}
          load: true
          tags: enterich:test
          push: false
      - name: Tests in the image
        env:
          PLATFORM: ${{ matrix.platform }}
        run: docker run --rm --platform "$PLATFORM" enterich:test
