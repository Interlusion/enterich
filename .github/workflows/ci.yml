name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Lock matches pyproject.toml
        run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mdformat --check .
      - name: Markdown links
        run: scripts/check-links.sh
      - run: uv run basedpyright
      - name: Tests with branch coverage
        run: |
          uv run coverage run -m pytest -q
          uv run coverage report --skip-covered
      - name: Vulnerability audit of the lock
        run: |
          uv export --locked --format requirements-txt --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict --require-hashes --disable-pip -r "$RUNNER_TEMP/requirements.txt"
      - name: Workflows
        run: scripts/check-workflows.sh

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks over the pushed commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="HEAD"
          else
            range="$BASE..HEAD"
          fi
          docker build -q -t gitleaks .github/gitleaks
          docker run --rm -v "$PWD:/repo" -w /repo gitleaks \
            git --redact --no-banner --log-opts="$range" .

  image:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
      - name: Test stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: test
          platforms: ${{ matrix.platform }}
          load: true
          tags: erpel:test
          push: false
      - name: Tests in the image
        env:
          PLATFORM: ${{ matrix.platform }}
        run: docker run --rm --platform "$PLATFORM" erpel:test
