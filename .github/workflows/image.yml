name: Release image

# Called by release.yml for the dry run and the tag run. Both build the image once for
# both architectures, test its test stage on each, and write the runtime image with the
# same build step; the runtime image reuses the layers the tests ran on. The dry run
# writes it as an OCI image layout and checks the index, the tag run pushes it. Only
# the tag run signs in to GHCR, attests and creates the release (releasing guide).
on:
  workflow_call:
    inputs:
      version:
        description: The version X.Y.Z, checked by release.yml
        required: true
        type: string
      publish:
        description: Push the image and create the release; otherwise keep the files as artefacts
        required: true
        type: boolean

# No permissions of its own: a called workflow can only narrow its caller's, so each
# job in release.yml grants exactly what its run needs.

env:
  IMAGE: ghcr.io/interlusion/erpel
  VERSION: ${{ inputs.version }}
  # The SBOM scanner BuildKit runs, pinned like the actions; Dependabot can't see it.
  SBOM_SCANNER: docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sign in to GHCR
        if: inputs.publish
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: The version isn't published yet
        if: inputs.publish
        run: |
          # A published image tag is never overwritten (ADR-004), also not by a re-run.
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION exists already"
            exit 1
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Test stage, amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          platforms: linux/amd64
          load: true
          tags: erpel:test-amd64
          push: false
      - name: Tests in the image, amd64
        run: docker run --rm --platform linux/amd64 erpel:test-amd64
      - name: Test stage, arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          platforms: linux/arm64
          load: true
          tags: erpel:test-arm64
          push: false
      - name: Tests in the image, arm64
        run: docker run --rm --platform linux/arm64 erpel:test-arm64
      - name: Where the image goes
        id: output
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$PUBLISH" = true ]; then
            echo "spec=type=image,name=$IMAGE:$VERSION,push=true" >> "$GITHUB_OUTPUT"
          else
            echo "spec=type=oci,dest=$RUNNER_TEMP/oci,tar=false,name=$IMAGE:$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - name: Runtime image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          attests: |
            type=sbom,generator=${{ env.SBOM_SCANNER }}
            type=provenance,mode=max
          outputs: ${{ steps.output.outputs.spec }}

      # The dry run: check the index, keep notes, tool contract, SBOM and provenance.
      - name: Dry-run files
        if: ${{ !inputs.publish }}
        run: |
          out="$RUNNER_TEMP/release"
          python3 scripts/image_index.py "$RUNNER_TEMP/oci" "$out" "$IMAGE:$VERSION" \
            linux/amd64 linux/arm64
          python3 scripts/changelog.py "$VERSION" --draft > "$out/notes.md"
          cp tests/snapshots/tools.json "$out/erpel-$VERSION-tools.json"
      - name: Dry-run artefact
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dry-run-${{ inputs.version }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 30

  # The tag run, after the push: its own job, so a failure here is re-run without
  # building or pushing again.
  release:
    needs: image
    if: inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sign in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true
      - name: GitHub release
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          # gh calls api.github.com, authenticated with the workflow's token; a release
          # can't be created another way.
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          python3 scripts/changelog.py "$VERSION" > "$notes"
          # The backticks are Markdown for the release notes, not command substitution.
          # shellcheck disable=SC2016
          printf '\n## Image\n\n`%s:%s`, digest `%s`\n' "$IMAGE" "$VERSION" "$DIGEST" >> "$notes"
          cp tests/snapshots/tools.json "$RUNNER_TEMP/erpel-$VERSION-tools.json"
          gh release create "v$VERSION" --verify-tag --title "Erpel $VERSION" \
            --notes-file "$notes" "$RUNNER_TEMP/erpel-$VERSION-tools.json"
