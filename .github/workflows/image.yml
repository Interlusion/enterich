name: Release image

# Called by release.yml for the dry run and the tag run. Both build and test the test
# stage for each architecture on a runner of that architecture, then write the runtime
# image for both with the same build step, from the layers the tests ran on: the test
# jobs hand over their build cache, so the image job builds nothing anew. The dry run
# writes the image as an OCI image layout and checks the index, the tag run pushes it. Only the tag run signs in to GHCR, attests, creates the release and
# publishes the entry in the MCP Registry (releasing guide).
on:
  workflow_call:
    inputs:
      version:
        description: The version X.Y.Z, checked by release.yml
        required: true
        type: string
      publish:
        description: Push the image and create the release; otherwise keep the files as artefacts
        required: true
        type: boolean

# No permissions of its own: a called workflow can only narrow its caller's, so each
# job in release.yml grants exactly what its run needs.

env:
  IMAGE: ghcr.io/interlusion/enterich
  VERSION: ${{ inputs.version }}
  # The build records stay out of the run's artefacts; the job summary remains.
  DOCKER_BUILD_RECORD_UPLOAD: false
  # The SBOM scanner BuildKit runs, pinned like the actions; Dependabot can't see it.
  SBOM_SCANNER: docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

jobs:
  test:
    name: test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # Read only, whatever the caller grants: the tests need no write rights.
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Test stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          platforms: ${{ matrix.platform }}
          load: true
          tags: enterich:test
          push: false
          # Every layer, the build stage's too, for the image job.
          cache-to: type=local,dest=${{ runner.temp }}/cache,mode=max
      - name: Tests in the image
        env:
          PLATFORM: ${{ matrix.platform }}
        run: docker run --rm --platform "$PLATFORM" enterich:test
      - name: Build cache for the image job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-cache-${{ matrix.arch }}
          path: ${{ runner.temp }}/cache
          if-no-files-found: error
          retention-days: 7

  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sign in to GHCR
        if: inputs.publish
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: The version isn't published yet
        if: inputs.publish
        run: |
          # A published image tag is never overwritten (ADR-004), also not by a re-run.
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION exists already"
            exit 1
          fi
      - name: The test jobs' build caches
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-cache-*
          path: ${{ runner.temp }}/cache
      # No setup-qemu-action: the arm64 layers come from the arm64 test job's cache.
      # Were one missing, BuildKit would build it with its own emulator, only slower.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Without it, BuildKit's provenance carries GitHub's whole event payload,
          # which for a tag push names the pusher and the commit's authors with their
          # email addresses, published with the image. GitHub's own attestation
          # identifies the workflow run.
          driver-opts: provenance-add-gha=false
      - name: Where the image goes
        id: output
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$PUBLISH" = true ]; then
            echo "spec=type=image,name=$IMAGE:$VERSION,push=true" >> "$GITHUB_OUTPUT"
          else
            echo "spec=type=oci,dest=$RUNNER_TEMP/oci,tar=false,name=$IMAGE:$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - name: Runtime image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: |
            type=local,src=${{ runner.temp }}/cache/build-cache-amd64
            type=local,src=${{ runner.temp }}/cache/build-cache-arm64
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          attests: |
            type=sbom,generator=${{ env.SBOM_SCANNER }}
            type=provenance,mode=max
          outputs: ${{ steps.output.outputs.spec }}

      # The dry run: check the index, keep notes, tool contract, SBOM and provenance.
      - name: Dry-run files
        if: ${{ !inputs.publish }}
        run: |
          out="$RUNNER_TEMP/release"
          python3 scripts/image_index.py "$RUNNER_TEMP/oci" "$out" "$IMAGE:$VERSION" \
            linux/amd64 linux/arm64
          python3 scripts/changelog.py "$VERSION" --draft > "$out/notes.md"
          cp tests/snapshots/tools.json "$out/enterich-$VERSION-tools.json"
      - name: Dry-run artefact
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dry-run-${{ inputs.version }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 30

  # The tag run, after the push: its own job, so a failure here is re-run without
  # building or pushing again.
  release:
    needs: image
    if: inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sign in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true
      - name: GitHub release
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          # gh calls api.github.com, authenticated with the workflow's token; a release
          # can't be created another way.
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          python3 scripts/changelog.py "$VERSION" > "$notes"
          # The backticks are Markdown for the release notes, not command substitution.
          # shellcheck disable=SC2016
          printf '\n## Image\n\n`%s:%s`, digest `%s`\n' "$IMAGE" "$VERSION" "$DIGEST" >> "$notes"
          cp tests/snapshots/tools.json "$RUNNER_TEMP/enterich-$VERSION-tools.json"
          gh release create "v$VERSION" --verify-tag --title "Enterich $VERSION" \
            --notes-file "$notes" "$RUNNER_TEMP/enterich-$VERSION-tools.json"

  # The tag run, after the release: the entry in the MCP Registry, which checks the pushed
  # image's label. Its own job, so only it reads the registry's key, from the environment
  # mcp-registry, and a failure is re-run alone.
  registry:
    needs: release
    if: inputs.publish
    runs-on: ubuntu-24.04
    environment: mcp-registry
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: The publisher
        run: scripts/mcp-publisher.sh "$RUNNER_TEMP"
      - name: Entry in the MCP Registry
        env:
          # The Ed25519 key whose public half is in the TXT record of the namespace's domain.
          KEY: ${{ secrets.MCP_REGISTRY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::MCP_REGISTRY_KEY is empty: the environment mcp-registry lacks it, or release.yml doesn't pass secrets"
            exit 1
          fi
          # dev.interlusion/enterich is published under the domain interlusion.dev.
          domain=$(jq -r '.name | split("/")[0] | split(".") | reverse | join(".")' server.json)
          "$RUNNER_TEMP/mcp-publisher" login dns --domain "$domain" --private-key "$KEY"
          "$RUNNER_TEMP/mcp-publisher" publish server.json
