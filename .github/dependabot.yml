version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]
        # The MCP SDK always gets its own pull request (ADR-005).
        exclude-patterns: [mcp, mcp-types]
  - package-ecosystem: docker
    directories: [/, /.github/gitleaks]
    schedule:
      interval: weekly
    groups:
      images:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
