version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]
        # The MCP SDK always gets its own pull request (ADR-005).
        exclude-patterns: [mcp, mcp-types]
  - package-ecosystem: docker
    directories: [/, /.github/actionlint, /.github/gitleaks, /.github/lychee]
    schedule:
      interval: weekly
    groups:
      images:
        update-types: [minor, patch]
  # The ERPNext site of the end-to-end tests: each newer ERPNext is a pull request of its
  # own, so a run against it can be started on its branch before merging.
  - package-ecosystem: docker-compose
    directory: /tests/e2e
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
